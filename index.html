<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ADE Scolaire - Emploi du temps</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <div class="header-content">
                <div class="logo">EILCO</div>
                <h1>Emploi du temps</h1>
                <div class="week-title">Semaine en cours</div>
            </div>
        </header>

        <main>
            <div class="calendrier">
                
                <table class="timetable">
                    <thead>
                        <tr>  
                            <th class="hour-header">Horaires</th>
                            <th>Lundi</th>
                            <th>Mardi</th>
                            <th>Mercredi</th>
                            <th>Jeudi</th>
                            <th>Vendredi</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                        <!-- 08h00 - 09h00 -->
                        <tr data-heure="08h00">
                            <td class="hour-cell">08h00 - 09h00</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 09h00 - 10h00 -->
                        <tr data-heure="09h00">
                            <td class="hour-cell">09h00 - 10h00</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 10h15 - 11h15 -->
                        <tr data-heure="10h15">
                            <td class="hour-cell">10h15 - 11h15</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 11h15 - 12h15 -->
                        <tr data-heure="11h15">
                            <td class="hour-cell">11h15 - 12h15</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 12h15 - 13h15 : Pause Déjeuner -->
                        <tr class="pause-row" data-heure="12h15">
                            <td class="hour-cell">12h15 - 13h15</td>
                            <td colspan="5" class="pause-cell">PAUSE DEJEUNER</td>
                        </tr>

                        <!-- 13h15 - 14h15 -->
                        <tr data-heure="13h15">
                            <td class="hour-cell">13h15 - 14h15</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 14h15 - 15h15 -->
                        <tr data-heure="14h15">
                            <td class="hour-cell">14h15 - 15h15</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 15h30 - 16h30 -->
                        <tr data-heure="15h30">
                            <td class="hour-cell">15h30 - 16h30</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 16h30 - 17h30 -->
                        <tr data-heure="16h30">
                            <td class="hour-cell">16h30 - 17h30</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>

                        <!-- 17h30 - 19h00 -->
                        <tr data-heure="17h30">
                            <td class="hour-cell">17h30 - 19h00</td>
                            <td data-jour="Lundi"></td>
                            <td data-jour="Mardi"></td>
                            <td data-jour="Mercredi"></td>
                            <td data-jour="Jeudi"></td>
                            <td data-jour="Vendredi"></td>
                        </tr>
                    </tbody>
                </table> 
                   
            </div>
        </main>

        <footer>
            <p>&copy; ADE Scolaire - EILCO</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
